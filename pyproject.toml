[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-pc"
version = "0.3.0"
description = "Лёгкий локальный голосовой помощник для Windows"
requires-python = ">=3.10,<3.13"
dependencies = [
  "vosk==0.3.45",
  "sounddevice==0.5.6",
  "webrtcvad-wheels==2.0.14.post1",
  "pycaw==20260927; sys_platform == 'win32'",
]

[project.scripts]
jarvis = "jarvis_pc.cli:main"

[project.gui-scripts]
jarvis-desktop = "jarvis_pc.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jarvis_pc = ["assets/*.ico"]
